[project]
name = "futures-analyzer"
version = "0.1.0"
description = "Futures piyasa analiz asistanı. Otomatik işlem yapmaz, sadece analiz üretir."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.53.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futures_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: internete bağlanan testler (varsayılan olarak atlanır)"]
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
