# Proje adı sabit: klasör adı farklı olsa da (örn. futuresanalyzer) aynı veritabanı kullanılır
name: futures-analyzer

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: futures
      POSTGRES_PASSWORD: futures
      POSTGRES_DB: futures
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
